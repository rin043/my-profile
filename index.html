<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>introduce3persons</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div class="flex sm:flex-row gap-4 max-w-5xl mx-auto px-8">
      <div class="flex flex-col items-center text-center w-72 p-4 border rounded-lg shadow">
        <img src="./img/ジャワ原人.jpg" alt="ジャワ原人">
        <h2>ジャワ原人</h2>
        <p>インドネシアのジャワ島のトリニールで発見された原人に属する代表的な化石人類。年代は約100万年前頃と50万年前ごろと10万年前頃</p>
      </div>
      <div  class="flex flex-col items-center text-center w-72 p-4 border rounded-lg shadow">
        <img src="./img/ハイデルベルク人.jpg" alt="ハイデルブルク人">
        <h2>ハイデルブルク人</h2>
        <p>ホモ＝エレクトゥスから分岐し、アフリカからヨーロッパ大陸に広がった。彼らからネアンデルタール人と人類が分かれて進化したと考えられている。</p>
      </div>
      <div class="flex flex-col items-center justify-center text-center w-72 p-4 border rounded-lg shadow">
        <img src="./img/デニソワ人③コピー.jpg" alt="デニソワ人">
        <h2>デニソワ人</h2>
        <p>絶滅した旧人類の一種または亜種とされており、ネアンデルタール人との遺伝的な近縁性が示唆されている。アジア全域に生息していた。</p>
      </div>
    </div>
  </body>
</html>

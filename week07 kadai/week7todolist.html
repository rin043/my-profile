<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>TODOリスト</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

        <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6">TODOリスト</h1>

            <div class="flex gap-2 mb-6">
                <input id="todoInput" type="text" placeholder="タスクを入力..."
                class="flex-1 border border-gray-300 rounded px-3 py-2">
                <button id="addBtn" class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">追加</button>
            </div>

            <ul id="todoList" class="space-y-2"></ul>
        </div>
        
        <script>
            const addBtn = document.querySelector("#addBtn");
            const todoInput = document.querySelector("#todoInput")
            const todoList = document.querySelector("#todoList");

            addBtn.addEventListener("click", () => {
                const text = todoInput.value;

                if (text === ""){
                    return;
                }


            const item = document.createElement("li");
            item.className = "flex items-center justify-center bg-gray rounded px-3 py-2";

            const span = document.createElement("span");
            span.textContent = text;

            const doneBtn = document.createElement("button");
            doneBtn.textContent = "完了";
            doneBtn.className = "text-sm text-white bg-green-500 px-2 py-1 rounded hover:text-red-500";

            doneBtn.addEventListener("click", () => {
                span.classList.add("line-through");
                span.classList.add("text-gray-400");
            });

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "削除";
            deleteBtn.className = "text-sm text-white bg-red-500 px-2 py-1 rounded hover:bg-red-600"

            deleteBtn.addEventListener("click", () => {
                if (confirm(`「${text}」を削除してもよろしいですか`)){
                    item.remove();
                }
            });

            item.appendChild(span);
            item.appendChild(doneBtn);
            item.appendChild(deleteBtn);
            todoList.appendChild(item);
            
            todoInput.value = "";

            });        

            </script>

    </body>
</html>

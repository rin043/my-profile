<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week10 課題　がんばろう</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 p-8 flex items-center justify-center">

    <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <h1 class="text-xl font-bold text-slate-900 mb-4">GitHubユーザー検索</h1>

        <div class="flex gap-2 mb-6">
            <input type="text" id="usernameInput"
            class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-blue-400"
            placeholder="GitHubユーザー名を入力">
            <button id="sejarchBtn" class="rounded bg-blue-600 px-4 py-3 font-medium text-white hover:bg-blue transition">検索</button>
        </div>

        <p id="status" class="text-sm text-slate-500 mb-4 hidden"></p>

        <div id="userInfo" class="hidden flex flex-col items-center text-center">
            <img id="avatar" src="" alt="アバター画像" class="w-full h-24 rounded-full mb-4 border">
            <h2 id="name" class="text-lg font-bold text-slate-900 mb-1"></h2>
            <p id="bio" class="text-xs text-slate-600 mb-3"></p>
            <div class="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full">
                フォロワー:<span id="followers" class="font-bold text-slate-800"></span>人
            </div>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById("usernameInput");
        const searchBtn = document.getElementById("searchBtn");
        const status = document.getElementById("status");
        const userInfo = document.getElementById("userInfo");        

        const avatar = document.getElementById("avatar");
        const nameEl = document.getElementById("name");
        const  bioEl= document.getElementById("bio");
        const followersEl = document.getElementById("followers");

        async function fetchGitHubUser(){
            const username = usernameInput.value.trim();

            if(!username){
                status.textContent = "";
                status.classList.remove("hidden", "text-red-500");
                status.classList.add("text-slate-500", "mb-4");
                userInfo.classList.add("hidden");
                return;
            }

            status.textContent = "読み込み中…";
            status.className = "text-sm text-slate-500 mb-4";
            userInfo.classList.add("hidden");

            try{
                const response = await fetch (`https://api.github.com/users/${username}`);

                if(!response.ok){
                    throw new Error("ユーザーが見つかりませんでした");
                }

                const data = await response.json();
                console.log(data);

                avatar.src = data.avatar_url;
                nameEl.textcontent = data.name || data.login;
                bioEl.textContent = data.bio || "自己紹介はありません";
                followersEl.textContent = data.followers;

                status.textContent = "ユーザー名を入力してください";
                status.classList.add("hidden");
                userInfo.classList.remove("hidden");
                userInfo.classList.add("flex");
            }
            catch(error){
                console.error(error);
                status.classList.remove("hidden");
                status.classList.add("text-red-500");
                status.textContent = error.message === "ユーザーが見つかりませんでした"
                    ? error.message
                    :"取得に失敗しました"
            }
        }

        searchBtn.addEventListener("click", fetchGitHubUber);
    </script>
</body>
</html>

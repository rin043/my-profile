<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week12 ｜課題　</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 py-12 px-4 flex justify-between items-center">

    <div class="w-full max-w-2xl my-auto space-y-7">

        <header class="bg-white rounded-2xl border border-slate-200  p-8 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
            <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-xs font-semibold rounded-full mb-3">自己紹介</span>
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mt-4">小林凜</h2>
            <hr class="my-4 border-slate-100">
            <p class="text-sm md:text-base text-slate-700 leading-relaxed font-medium">キャッチコピー：
                <span>全体のバランスを見極め、チームの課題を共に解決するサポーター。</span>
            </p>
        </header>
        
        <section class="bg-white rounded-2xl border border-slate-200 p-6 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-2 h-5 bg-blue-600 rounded-full inline-block"></span>
                学んだこと・できるようになったこと
            </h2>
            <ul class="space-y-2.5 text-sm text-slate-700 gap-2">
                <li class="flex items-center">☑Tailwindの空白・幅・文字・色の付け方</li>
                <li class="flex items-center">☑スマホ版とパソコン版での表示の切り替え</li>
                <li class="flex items-center">☑JSでの新しい関数の作り方</li>
                <li class="flex items-center">☑JSでのフォームの作り方</li>
                <li class="flex items-center">☑ヘッターとフッターの作り方</li>
            </ul>
        </section>
        <section class="splide transition-all duration-300 hover:-translate-y-1 hover:shadow-lg" aria-label="作品スライダー">
            <div class="splide__track">
                <ul class="splide__list">
                    <li class="splide__slide">
                        <div class="flex h-32 items-center justify-center rounded-lg bg-indigo-500 text-2xl font-bold text-white">作品１</div>
                    </li>
                    <li class="splide__slide">
                        <div class="flex h-32 items-center justify-center rounded-lg bg-emerald-500 text-2xl font-bold text-white">作品２</div>
                    </li>
                    <li class="splide__slide">
                        <div class="flex h-32 items-center justify-center rounded-1g bg-rose-500 text-2xl font-bold text-white">作品３</div>
                    </li>
                </ul>
            </div>
        </section>

        <footer class="mt-auto py-6 text-center text-xs text-slate-400">
            <p>POSSE③7.0小林凜　詳細情報は本人に聞いてください。</p>
        </footer>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script>
        new Splide('.splide').mount();
    </script>
</body>
</html>
